name: CI-CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código fonte
        uses: actions/checkout@v4.2.2

      - name: Set Up JDK 17
        uses: actions/setup-java@v4.5.0
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Show contents of the current working directory
        run: ls -la
        
      - name: Show contents of the target directory
        run: ls -la target
      
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: Dockerfile
          tags: |
            davilopess/pauta-api:1.0.${{ github.run_number }}
            davilopess/pauta-api:latest

  CD:
    runs-on: ubuntu-latest
    needs: [CI]
    steps:
      - name: Checkout do código fonte
        uses: actions/checkout@v4.2.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.1.7
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Configuraçã do Kubeconfig
        run : aws eks update-kubeconfig --name (***)
        uses: Azure/k8s-deploy@v5.0.1
        with:
          manifests: |
              ./k8s/deployment.yaml
              k8s/mongo.yaml
          images: |
          davilopess/pauta-api:1.0.${{ github.run_number }}
