# ... Service YAML definition
apiVersion: v1
kind: Service
metadata:
  name: pauta-api
spec:
  selector:
    app: pauta-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30000
  type: NodePort
# ... Deployment YAML definition
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pauta-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pauta-api
  template:
    metadata:
      labels:
        app: pauta-api
    spec:
      containers:
        - name: app
          image: davilopess/pauta-api:1.0.2
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_URL
              value: mongodb://mongo:27017/dev
          imagePullPolicy: Always


